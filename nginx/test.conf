# ── What is an upstream block? ────────────────────────────────────────────────
# Nginx doesn't talk to your Node.js app directly in the location block.
# Instead you first define a named "pool" of backend servers called an upstream.
# Here our pool has only one member: the samvyo-api container on port 3000.
#
# Why use a service name "samvyo-api" instead of an IP address?
# Docker has its own internal DNS. Every service in a docker-compose network gets
# a hostname equal to its service name. So "samvyo-api:3000" resolves correctly
# inside the Docker network — no hard-coded IPs needed.
upstream samvyo_api {
    server samvyo-api:3000;
}

server {
    # Listen on port 80 (plain HTTP — fine for local test, production uses 443)
    listen 80;

    # server_name tells Nginx which domain name this server block responds to.
    #
    # HOW IT WORKS:
    # When a browser visits http://v3-test.samvyo.com, it sends a request with
    # the header: Host: v3-test.samvyo.com
    # Nginx reads that header and matches it against server_name.
    # If it matches → this server block handles the request.
    # If it doesn't match → Nginx returns 444 (no response).
    #
    # WHY NOT "_" anymore?
    # We used "_" (catch-all) earlier when accessing via raw IP (65.1.240.111).
    # Now the CEO has mapped v3-test.samvyo.com → 65.1.240.111 in DNS.
    # So requests arrive with a real Host header — we match it explicitly.
    # Being explicit is safer: only requests for our domain are served.
    #
    # In production (Day 6) this becomes: server_name dashboard.samvyo.dev;
    server_name v3-test.samvyo.com;

    # location / means: apply these rules to ALL incoming request paths (/, /health, /api/...)
    location / {

        # Forward every request to the upstream pool defined above
        proxy_pass http://samvyo_api;

        # Use HTTP/1.1 between Nginx and the Node.js backend.
        # HTTP/1.0 (the default) closes the connection after each response.
        # HTTP/1.1 keeps the connection alive — required for WebSockets.
        proxy_http_version 1.1;

        # ── WebSocket upgrade headers ─────────────────────────────────────────
        # A WebSocket connection starts as a normal HTTP request but then "upgrades"
        # its protocol. These two headers carry that upgrade signal through Nginx.
        #
        # Without these:
        #   Browser sends: Upgrade: websocket, Connection: Upgrade
        #   Nginx strips them (default behaviour)
        #   Node.js never sees the upgrade → WS connection silently fails
        #   Samvyo signaling breaks completely
        proxy_set_header Upgrade    $http_upgrade;   # pass the Upgrade header as-is
        proxy_set_header Connection "upgrade";       # tell backend to expect an upgrade

        # Pass the original Host header so Node.js knows which domain was requested
        proxy_set_header Host $host;

        # Pass the real client IP to Node.js (instead of Nginx's own IP)
        # Your app can log this with req.headers['x-real-ip']
        proxy_set_header X-Real-IP $remote_addr;

        # How long Nginx waits for a response from Node.js before giving up.
        # 3600s = 1 hour — necessary for long-lived WebSocket video sessions.
        # Without this, Nginx closes idle WS connections after 60s (default).
        proxy_read_timeout 3600s;
    }
}
