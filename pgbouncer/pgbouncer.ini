# ── pgbouncer.ini — Connection pooler configuration ───────────────────────────
#
# WHAT PGBOUNCER DOES (simple explanation):
# Imagine a busy restaurant. Customers (Node.js connections) keep arriving.
# Without PgBouncer: every customer gets a dedicated waiter (postgres process).
# 200 customers = 200 waiters = kitchen overwhelmed = restaurant crashes.
#
# With PgBouncer: 200 customers are handled by a maitre d' (PgBouncer).
# The maitre d' only ever sends 20 orders to the kitchen (postgres).
# Customers wait milliseconds for a free slot — they never notice.
#
# WHY THIS MATTERS FOR SAMVYO:
# Each PM2 worker opens ~10 DB connections.
# 2 servers × 4 workers × 10 connections = 80 connections minimum.
# Under load this spikes to 200+.
# PostgreSQL forks a process per connection → 200 processes → out of memory.
# PgBouncer collapses 200 app connections into 20 postgres connections.

[databases]
# Format: alias = host=X port=X dbname=X
# "samvyo" is the alias Node.js uses in its connection string.
# "postgres" is the Docker service name (resolved by Docker DNS).
samvyo = host=postgres port=5432 dbname=samvyo

[pgbouncer]
# ── Network ───────────────────────────────────────────────────────────────────
listen_port = 5433
# PgBouncer listens on 5433 (not 5432) to avoid confusion with real postgres.
# Node.js connects to pgbouncer:5433 instead of postgres:5432.

listen_addr = 0.0.0.0
# Accept connections from any address inside the Docker network.
# Safe because this port is not exposed to the internet (no ports: in compose).

# ── Authentication ────────────────────────────────────────────────────────────
auth_type = md5
# Use MD5 password hashing to verify Node.js credentials.
# PgBouncer checks incoming credentials against userlist.txt.

auth_file = /etc/pgbouncer/userlist.txt
# File containing username + hashed password pairs.
# PgBouncer reads this to verify who is allowed to connect.

# ── Pooling ───────────────────────────────────────────────────────────────────
pool_mode = transaction
# MOST IMPORTANT SETTING. Three modes available:
#
# session     → connection held for entire client session (defeats the purpose)
# transaction → connection released back to pool after each transaction ← USE THIS
# statement   → released after each statement (breaks multi-statement transactions)
#
# "transaction" is correct for stateless Node.js apps.
# After each INSERT/SELECT/UPDATE, the postgres connection goes back to the pool.
# The next query from any worker can reuse it immediately.

max_client_conn = 200
# Maximum connections PgBouncer accepts from Node.js workers.
# Our app: 2 servers × 4 workers × ~10 connections = ~80 normal, 200 peak.

default_pool_size = 20
# Actual connections PgBouncer maintains to PostgreSQL.
# 200 app connections → funneled through → 20 real postgres connections.
# Each postgres connection uses ~10MB RAM: 20 × 10MB = 200MB (very efficient).
# Increase this if queries start queueing (check pgbouncer logs).

reserve_pool_size = 5
# Extra connections kept in reserve for traffic spikes.
# If all 20 pool connections are busy, PgBouncer can temporarily use 5 more.
# Total max postgres connections: 20 + 5 = 25 (still well under our limit of 100).

reserve_pool_timeout = 3
# Wait 3 seconds before using reserve pool connections.
# Prevents reserve from being used for normal load spikes.

server_idle_timeout = 600
# Close idle postgres connections after 10 minutes.
# Keeps the pool lean — no point holding 20 connections at 3 AM with no traffic.

# ── Logging ───────────────────────────────────────────────────────────────────
logfile = /var/log/pgbouncer/pgbouncer.log
pidfile = /var/run/pgbouncer/pgbouncer.pid

# ── Admin ─────────────────────────────────────────────────────────────────────
admin_users = samvyo
# Allows the samvyo user to connect to the pgbouncer admin console.
# Useful for checking pool stats: SHOW POOLS; SHOW STATS;
