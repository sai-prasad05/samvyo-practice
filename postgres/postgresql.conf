# ── postgresql.conf — Performance tuning for Samvyo test server ───────────────
#
# WHY THIS FILE EXISTS:
# PostgreSQL ships with conservative defaults designed to work on any machine —
# even one with 256MB of RAM. It has no idea your server has 8GB.
# Without tuning: queries read from disk constantly → slow responses.
# With tuning: PostgreSQL uses RAM aggressively → fast queries.
#
# HOW IT'S USED:
# This file is mounted into the postgres container via docker-compose.yml.
# PostgreSQL reads it on startup instead of its built-in defaults.
#
# NOTE: These values are tuned for our CEO's server (2 vCPU, 8GB RAM).
# The PDF shows values for a 16GB server — we halved them here.

# ── Memory ────────────────────────────────────────────────────────────────────

shared_buffers = 2GB
# The most important setting. PostgreSQL keeps this much data in shared memory
# (RAM) as a cache. When a query needs data, it checks here first before
# going to disk. Rule of thumb: 25% of total RAM.
# Our server: 8GB × 25% = 2GB
# PDF (16GB server): 4GB
# Default: 128MB — wastes 93% of available RAM

effective_cache_size = 6GB
# NOT actual memory allocation. This tells the query PLANNER how much RAM
# is available for caching (shared_buffers + OS page cache combined).
# The planner uses this to decide whether a sequential scan or index scan
# is cheaper. Higher value → planner prefers index scans → faster queries.
# Rule of thumb: 75% of total RAM.
# Our server: 8GB × 75% = 6GB

work_mem = 16MB
# Memory per sort/join operation PER QUERY.
# WARNING: This multiplies. If 10 queries each do 5 sort operations:
# 10 × 5 × 16MB = 800MB used simultaneously.
# Keep this moderate. 16MB handles most Samvyo dashboard queries well.
# PDF (16GB server): 32MB

maintenance_work_mem = 256MB
# Memory for maintenance tasks: VACUUM, CREATE INDEX, ALTER TABLE.
# These run occasionally (not per-query), so a higher value is safe.
# Faster index builds = faster deploys that add new columns/indexes.
# PDF (16GB server): 512MB

# ── Write Performance ─────────────────────────────────────────────────────────

wal_buffers = 16MB
# WAL = Write-Ahead Log. Every INSERT/UPDATE/DELETE is written here first
# before going to the actual data files. This is how PostgreSQL ensures
# data isn't lost if the server crashes mid-transaction.
# Larger buffer = fewer WAL flushes = faster writes.
# PDF (16GB server): 32MB

checkpoint_completion_target = 0.9
# When PostgreSQL writes dirty pages to disk (a "checkpoint"), it spreads
# the work over 90% of the checkpoint interval instead of doing it all at once.
# Without this: checkpoints cause sudden disk I/O spikes → query latency spikes.
# 0.9 = smooth, steady disk writes = consistent query response times.

max_wal_size = 1GB
# Maximum size of WAL files before forcing a checkpoint.
# Larger = fewer checkpoints = better write performance.
# PDF (16GB server): 2GB

# ── Connections ───────────────────────────────────────────────────────────────

max_connections = 100
# Maximum simultaneous connections PostgreSQL accepts.
# Each connection = one OS process = ~5-10MB RAM.
# 100 × 10MB = 1GB RAM just for connections.
#
# WHY KEEP THIS LOW:
# PgBouncer (Step 3) sits in front of PostgreSQL and pools connections.
# Node.js talks to PgBouncer (up to 200 connections).
# PgBouncer talks to PostgreSQL (only 20-25 real connections).
# So 100 is more than enough — PgBouncer never opens more than 25.

# ── Logging (essential for debugging) ─────────────────────────────────────────

log_min_duration_statement = 1000
# Log any query that takes longer than 1000ms (1 second).
# This is your first diagnostic tool when users complain about slowness.
# Check: docker exec samvyo-postgres-1 cat /var/log/postgresql/...
# Or: docker compose logs postgres | grep duration

log_checkpoints = on
# Log when checkpoints happen and how long they take.
# Frequent slow checkpoints = you need more max_wal_size or faster disk.

log_connections = on
# Log every new connection to the database.
# Useful for detecting connection leaks or unexpected access patterns.

log_line_prefix = '%t [%p]: '
# Format: timestamp [process-id]:
# Example: 2026-05-30 14:32:01 UTC [1234]: LOG: connection received
# Makes logs easy to grep and correlate with specific queries.
